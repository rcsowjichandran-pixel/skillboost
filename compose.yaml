services:
 
  web:
    build: .
    container_name: django_app
 
    command: sh -c "python manage.py collectstatic --noinput && exec python manage.py runserver 0.0.0.0:8000"
 
    volumes:
      - .:/app
 
    ports:
      - "8000:8000"
 
    env_file:
      - .env
 
    depends_on:
      db:
        condition: service_healthy
 
  db:
    image: mysql:8.4
    container_name: mysql_db
 
    restart: always
 
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_ROOT_PASSWORD: root123
 
    ports:
      - "3307:3306"
 
    volumes:
      - mysql_data:/var/lib/mysql
 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10
 
volumes:
  mysql_data: